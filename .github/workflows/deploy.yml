on:
  push:
    branches:
      - master
    paths:
      - 'app/**'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::034362066129:role/github-actions-vpc-role
          aws-region: us-east-1

      - name: Ejecutar despliegue en EC2
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-0a89bed63802175be" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["cd /home/ec2-user/VPC/app && sudo -u ec2-user bash deploy.sh"]' \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-0a89bed63802175be"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-0a89bed63802175be" \
            --query '{Status:Status,Salida:StandardOutputContent,Errores:StandardErrorContent}'